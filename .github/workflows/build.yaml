name: "Build"

on: [push]

jobs:
  build:
    uses: netsurf-browser/ci-tools/.github/workflows/library-build.yaml@master
    with:
      # We don't build SVGTiny for Atari (m5475-atari-mint, m68k-atari-mint).
      toolchains: >-
        [
          "arm-riscos-gnueabi",
          "arm-unknown-riscos",
          "i686-w64-mingw32",
          "m68k-unknown-amigaos",
          "ppc-amigaos",
          "x86_64-w64-mingw32"
        ]
